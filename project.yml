name: FirePumpLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  FirePumpLog:
    type: application
    platform: iOS
    sources:
      - path: FirePumpLog
      - path: Shared
    dependencies:
      - target: FirePumpLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fire-pump-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: FirePumpLog/FirePumpLog.entitlements
    info:
      path: FirePumpLog/Info.plist
      properties:
        CFBundleDisplayName: Fire Pump Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo to attach to a record.
        NSPhotoLibraryUsageDescription: Choose a photo to attach to a record.
        ITSAppUsesNonExemptEncryption: false
  FirePumpLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FirePumpLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fire-pump-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: FirePumpLogWidget/FirePumpLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: FirePumpLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Fire Pump Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  FirePumpLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FirePumpLogTests
    dependencies:
      - target: FirePumpLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fire-pump-log.tests
        GENERATE_INFOPLIST_FILE: YES
  FirePumpLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FirePumpLogUITests
    dependencies:
      - target: FirePumpLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fire-pump-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FirePumpLog
schemes:
  FirePumpLog:
    build:
      targets:
        FirePumpLog: all
        FirePumpLogTests: [test]
        FirePumpLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: FirePumpLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: FirePumpLog/StoreKit/Products.storekit
      targets:
        - FirePumpLogTests
        - FirePumpLogUITests
    archive:
      config: Release
